spring.application.name=zvyn-wellness-api

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.data.rest.base-path=/api

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Railway production connects to MySQL over its private network. Disable TLS
# negotiation here because the managed MySQL certificate is not trusted by the
# application JVM. Local development overrides this URL in application-local.properties.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:HoMYCare_DB}?sslMode=DISABLED&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Contact form email. Use a Google App Password for ZVYN_MAIL_PASSWORD, not the normal account password.
spring.mail.host=${ZVYN_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ZVYN_MAIL_PORT:587}
spring.mail.username=${ZVYN_MAIL_USERNAME:}
spring.mail.password=${ZVYN_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
zvyn.contact.recipient=${ZVYN_CONTACT_EMAIL:meerashvin@gmail.com}
