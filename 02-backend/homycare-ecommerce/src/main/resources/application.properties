spring.application.name=zvyn-wellness-api

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.data.rest.base-path=/api

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:HoMYCare_DB}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:homycareapp}
spring.datasource.password=${MYSQLPASSWORD:homycareapp}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Contact form email. Use a Google App Password for ZVYN_MAIL_PASSWORD, not the normal account password.
spring.mail.host=${ZVYN_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ZVYN_MAIL_PORT:587}
spring.mail.username=${ZVYN_MAIL_USERNAME:}
spring.mail.password=${ZVYN_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
zvyn.contact.recipient=${ZVYN_CONTACT_EMAIL:meerashvin@gmail.com}
